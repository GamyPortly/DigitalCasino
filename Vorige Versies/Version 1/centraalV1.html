<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Centraal scherm</title>
<style>
  body {
    background: #0b5c37;
    color: white;
    font-family: sans-serif;
    text-align: center;
    padding: 30px;
    margin: 0;
  }
  h1 { margin-bottom: 5px; }
  .subtitel { color: #b8e0c8; margin-bottom: 30px; }

  .qr-rij { display: flex; justify-content: center; gap: 60px; flex-wrap: wrap; }
  .qr-blok {
    background: #114a2e;
    border-radius: 16px;
    padding: 20px 30px;
    width: 220px;
  }
  .qr-blok img { width: 180px; height: 180px; background: white; border-radius: 8px; }
  .qr-blok h3 { margin-top: 15px; }
  .verbonden { color: #4ade80; font-weight: bold; }
  .niet-verbonden { color: #fbbf24; }

  .kaarten-rij { display: flex; justify-content: center; gap: 10px; margin: 10px 0 20px; }
  .kaart {
    width: 60px; height: 84px;
    background: white; color: #111;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6em; font-weight: bold;
  }
  .kaart.leeg { background: rgba(255,255,255,0.15); color: transparent; }
  .kaart.rood { color: #d21f1f; }

  .pot { font-size: 1.8em; color: gold; margin-bottom: 25px; }

  .spelers-rij { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
  .speler-kaart {
    background: #114a2e;
    border-radius: 14px;
    padding: 16px 26px;
    min-width: 180px;
    border: 3px solid transparent;
  }
  .speler-kaart.aan_de_beurt { border-color: #fbbf24; }
  .speler-kaart h3 { margin: 0 0 10px; }
  .speler-kaart .rij { display: flex; justify-content: space-between; font-size: 0.95em; margin: 4px 0; color: #b8e0c8; }
  .speler-kaart .rij b { color: white; }
  .gefold-label { color: #f87171; font-weight: bold; margin-top: 8px; }

  .timer { font-size: 2.5em; font-weight: bold; margin-top: 10px; }
  .timer.dringend { color: #f87171; }

  .wintekst { font-size: 1.6em; margin-top: 30px; color: #fde68a; }
  .startbericht { font-size: 1.3em; margin-top: 40px; color: #b8e0c8; }
</style>
</head>
<body>
  <h1>Poker Tafel</h1>
  <p class="subtitel" id="subtitel">Scan je eigen QR-code met je GSM om te beginnen</p>

  <div id="qr_zone" class="qr-rij">
    <div class="qr-blok">
      <h3>Speler 1</h3>
      <img src="/static/qr_speler1.png" alt="QR speler 1">
      <div id="status1" class="niet-verbonden">nog niet verbonden</div>
    </div>
    <div class="qr-blok">
      <h3>Speler 2</h3>
      <img src="/static/qr_speler2.png" alt="QR speler 2">
      <div id="status2" class="niet-verbonden">nog niet verbonden</div>
    </div>
  </div>

  <div id="spel_zone" style="display:none;">
    <div class="kaarten-rij" id="community"></div>
    <div class="pot">Pot: <span id="pot">0</span></div>

    <div class="spelers-rij" id="spelers"></div>

    <div id="timer_zone" class="timer"></div>
  </div>

  <div id="wintekst" class="wintekst"></div>
  <div id="startbericht" class="startbericht"></div>

<script>
const KLEUR_ROOD = ["\u2665", "\u2666"];

function kaart_html(kaart) {
  const isRood = KLEUR_ROOD.some(k => kaart.endsWith(k));
  return `<div class="kaart ${isRood ? 'rood' : ''}">${kaart}</div>`;
}

function lege_kaart_html() {
  return `<div class="kaart leeg">?</div>`;
}

async function ververs() {
  try {
    const res = await fetch("/status");
    const data = await res.json();

    const beideVerbonden = data.spelers[1].verbonden && data.spelers[2].verbonden;
    document.getElementById("status1").textContent = data.spelers[1].verbonden ? "verbonden" : "nog niet verbonden";
    document.getElementById("status1").className = data.spelers[1].verbonden ? "verbonden" : "niet-verbonden";
    document.getElementById("status2").textContent = data.spelers[2].verbonden ? "verbonden" : "nog niet verbonden";
    document.getElementById("status2").className = data.spelers[2].verbonden ? "verbonden" : "niet-verbonden";

    if (data.fase === "wachten") {
      document.getElementById("qr_zone").style.display = "flex";
      document.getElementById("spel_zone").style.display = "none";
      document.getElementById("wintekst").textContent = "";
      document.getElementById("startbericht").textContent = beideVerbonden
        ? (data.spel_keuze
            ? `${data.spellen[data.spel_keuze].naam} gekozen. Druk op je GSM op 'start spel'.`
            : "Beide spelers zijn verbonden. Kies een spel op je GSM.")
        : "";
      return;
    }

    document.getElementById("qr_zone").style.display = "none";
    document.getElementById("spel_zone").style.display = "block";
    document.getElementById("startbericht").textContent = "";

    const communityEl = document.getElementById("community");
    communityEl.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      if (i < data.community.length) {
        communityEl.innerHTML += kaart_html(data.community[i]);
      } else {
        communityEl.innerHTML += lege_kaart_html();
      }
    }

    document.getElementById("pot").textContent = data.pot;

    const spelersEl = document.getElementById("spelers");
    spelersEl.innerHTML = "";
    for (const pid of [1, 2]) {
      const s = data.spelers[pid];
      const aanDeBeurt = data.beurt === parseInt(pid) ? "aan_de_beurt" : "";
      spelersEl.innerHTML += `
        <div class="speler-kaart ${aanDeBeurt}">
          <h3>${s.naam} ${data.dealer == pid ? "(dealer)" : ""}</h3>
          <div class="rij"><span>inzet</span><b>${s.street_bet}</b></div>
          <div class="rij"><span>totaal chips</span><b>${s.chips}</b></div>
          <div class="rij"><span>laatste zet</span><b>${s.laatste_actie}</b></div>
          ${s.gefold ? '<div class="gefold-label">GEFOLD</div>' : ''}
        </div>`;
    }

    if (data.fase === "showdown") {
      document.getElementById("wintekst").textContent = data.wintekst;
      document.getElementById("timer_zone").textContent = "";
    } else if (data.fase === "einde") {
      document.getElementById("wintekst").textContent = data.wintekst;
      document.getElementById("timer_zone").textContent = "";
    } else {
      document.getElementById("wintekst").textContent = "";
      const t = data.resterende_tijd;
      const timerEl = document.getElementById("timer_zone");
      timerEl.textContent = `Speler ${data.beurt} heeft nog ${t} seconden`;
      timerEl.className = "timer" + (t <= 5 ? " dringend" : "");
    }

  } catch (e) {
    console.error("Kon status niet ophalen:", e);
  }
}

setInterval(ververs, 1000);
ververs();
</script>
</body>
</html>
