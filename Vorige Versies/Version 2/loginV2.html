<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen</title>
<style>
 body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
 input { display: block; width: 100%; max-width: 260px; padding: 10px; margin: 8px auto; }
 button { padding: 12px; width: 100%; max-width: 260px; margin: 6px auto; display: block; }
 .fout { color: red; }
</style>
</head>
<body>
 <h1>Speler {{ speler_id }}</h1>
 <h3>Inloggen</h3>
 <input id="login_naam" placeholder="gebruikersnaam">
 <input id="login_code" placeholder="4-cijferige code" maxlength="4">
 <button onclick="inloggen()">Inloggen</button>
 <h3>Nieuw account</h3>
 <input id="reg_naam" placeholder="kies een gebruikersnaam">
 <input id="reg_code" placeholder="kies een 4-cijferige code" maxlength="4">
 <button onclick="registreren()">Account aanmaken</button>
 <p class="fout" id="foutmelding"></p>
<script>
const SPELER_ID = "{{ speler_id }}";
async function inloggen() {
 const gebruikersnaam = document.getElementById("login_naam").value;
 const code = document.getElementById("login_code").value;
 const res = await fetch(`/login/${SPELER_ID}`, {
 method: "POST",
 headers: { "Content-Type": "application/json" },
 body: JSON.stringify({ gebruikersnaam: gebruikersnaam, code: code })
 });
 const data = await res.json();
 if (data.ok) {
 location.reload();
 } else {
 document.getElementById("foutmelding").textContent = data.fout;
 }
}
async function registreren() {
 const gebruikersnaam = document.getElementById("reg_naam").value;
 const code = document.getElementById("reg_code").value;
 const res = await fetch(`/registreer/${SPELER_ID}`, {
 method: "POST",
 headers: { "Content-Type": "application/json" },
 body: JSON.stringify({ gebruikersnaam: gebruikersnaam, code: code })
 });
 const data = await res.json();
 if (data.ok) {
 location.reload();
 } else {
 document.getElementById("foutmelding").textContent = data.fout;
 }
}
</script>
</body>
</html>
