<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Centraal scherm</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }
  .qr-rij { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
  .qr-blok { border: 1px solid #999; padding: 15px; }
  .qr-blok img { width: 160px; height: 160px; }
  .verbonden { color: green; font-weight: bold; }
  .niet-verbonden { color: orange; }
  .kaarten-rij { margin: 15px 0; }
  .kaart {
    display: inline-block;
    width: 50px; height: 70px;
    border: 1px solid #333;
    margin: 3px;
    line-height: 70px;
    font-size: 1.3em;
  }
  .pot { font-size: 1.3em; margin-bottom: 20px; }
  .spelers-rij { display: flex; justify-content: center; gap: 20px; }
  .speler-kaart { border: 1px solid #999; padding: 10px 20px; min-width: 150px; }
  .speler-kaart.aan_de_beurt { border: 3px solid orange; }
  .gefold-label { color: red; font-weight: bold; }
  .timer { font-size: 1.5em; margin-top: 15px; }
  .wintekst { font-size: 1.3em; margin-top: 20px; }
</style>
</head>
<body>
  <h1>Poker Tafel</h1>
  <p id="subtitel">Scan je eigen QR-code met je GSM om te beginnen</p>

  <div id="qr_zone" class="qr-rij">
    <div class="qr-blok">
      <h3>Speler 1</h3>
      <img src="/static/qr_speler1.png" alt="QR speler 1">
      <p id="status1" class="niet-verbonden">nog niet verbonden</p>
    </div>
    <div class="qr-blok">
      <h3>Speler 2</h3>
      <img src="/static/qr_speler2.png" alt="QR speler 2">
      <p id="status2" class="niet-verbonden">nog niet verbonden</p>
    </div>
  </div>

  <div id="spel_zone" style="display:none;">
    <div class="kaarten-rij" id="community"></div>
    <div class="pot">Pot: <span id="pot">0</span></div>
    <div class="spelers-rij" id="spelers"></div>
    <div id="timer_zone" class="timer"></div>
  </div>

  <div id="blackjack_zone" style="display:none;">
    <p id="bj_fase_tekst"></p>
    <div class="kaarten-rij">
      <p>Dealer:</p>
      <div class="kaarten-rij" id="bj_dealer_hand"></div>
    </div>
    <div class="spelers-rij" id="bj_spelers"></div>
  </div>

  <div id="wintekst" class="wintekst"></div>
  <p id="startbericht"></p>

  <audio id="geluid_schudden" src="/static/schudden.mp3"></audio>
  <audio id="geluid_klop" src="/static/klop.wav"></audio>
  <audio id="geluid_allin" src="/static/allin.mp3"></audio>
  <audio id="geluid_chips" src="/static/chips.mp3"></audio>
  <audio id="geluid_kaart" src="/static/kaart.mp3"></audio>

<script>
let vorige_fase = null;
let vorige_acties = { 1: "-", 2: "-" };

function speel(id) {
  const el = document.getElementById(id);
  el.currentTime = 0;
  el.play().catch(() => {});
}

async function ververs() {
  try {
    const res = await fetch("/status");
    const data = await res.json();

    const beideVerbonden = data.spelers[1].verbonden && data.spelers[2].verbonden;
    document.getElementById("status1").textContent = data.spelers[1].verbonden ? "verbonden" : "nog niet verbonden";
    document.getElementById("status1").className = data.spelers[1].verbonden ? "verbonden" : "niet-verbonden";
    document.getElementById("status2").textContent = data.spelers[2].verbonden ? "verbonden" : "nog niet verbonden";
    document.getElementById("status2").className = data.spelers[2].verbonden ? "verbonden" : "niet-verbonden";

    if (data.fase === "wachten") {
      vorige_fase = "wachten";
      vorige_acties = { 1: "-", 2: "-" };
      document.getElementById("qr_zone").style.display = "flex";
      document.getElementById("spel_zone").style.display = "none";
      document.getElementById("blackjack_zone").style.display = "none";
      document.getElementById("wintekst").textContent = "";
      document.getElementById("startbericht").textContent = beideVerbonden
        ? (data.spel_keuze
            ? `${data.spellen[data.spel_keuze].naam} gekozen. Druk op je GSM op 'start spel'.`
            : "Beide spelers zijn verbonden. Kies een spel op je GSM.")
        : "";
      return;
    }

    if (data.fase === "blackjack") {
      document.getElementById("qr_zone").style.display = "none";
      document.getElementById("spel_zone").style.display = "none";
      document.getElementById("blackjack_zone").style.display = "block";
      document.getElementById("startbericht").textContent = "";

      const bj = data.blackjack;
      if (!bj) return;

      const teksten = { inzetten: "Spelers zijn aan het inzetten...", spelen: "Blackjack wordt gespeeld", afgelopen: "Ronde afgelopen" };
      document.getElementById("bj_fase_tekst").textContent = teksten[bj.fase] || "";

      const dealerEl = document.getElementById("bj_dealer_hand");
      dealerEl.innerHTML = "";
      (bj.dealer_hand || []).forEach(k => {
        dealerEl.innerHTML += k === "verborgen"
          ? `<div class="kaart">?</div>`
          : `<div class="kaart">${k}</div>`;
      });

      const spelersEl = document.getElementById("bj_spelers");
      spelersEl.innerHTML = "";
      for (const pid of [1, 2]) {
        const s = bj.spelers[pid];
        if (!s) continue;
        spelersEl.innerHTML += `
          <div class="speler-kaart ${bj.beurt === parseInt(pid) ? 'aan_de_beurt' : ''}">
            <h3>${s.naam}</h3>
            <p>inzet: <b>${s.inzet}</b></p>
            <p>chips: <b>${s.chips}</b></p>
            <p>status: <b>${s.status}</b></p>
            ${s.resultaat ? `<p><b>${s.resultaat}</b></p>` : ''}
          </div>`;
      }
      return;
    }

    document.getElementById("qr_zone").style.display = "none";
    document.getElementById("spel_zone").style.display = "block";
    document.getElementById("blackjack_zone").style.display = "none";
    document.getElementById("startbericht").textContent = "";

    const communityEl = document.getElementById("community");
    communityEl.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      if (i < data.community.length) {
        communityEl.innerHTML += `<div class="kaart">${data.community[i]}</div>`;
      } else {
        communityEl.innerHTML += `<div class="kaart">?</div>`;
      }
    }

    document.getElementById("pot").textContent = data.pot;

    const spelersEl = document.getElementById("spelers");
    spelersEl.innerHTML = "";
    for (const pid of [1, 2]) {
      const s = data.spelers[pid];
      const aanDeBeurt = data.beurt === parseInt(pid) ? "aan_de_beurt" : "";
      spelersEl.innerHTML += `
        <div class="speler-kaart ${aanDeBeurt}">
          <h3>${s.naam} ${data.dealer == pid ? "(dealer)" : ""}</h3>
          <p>inzet: <b>${s.street_bet}</b></p>
          <p>totaal chips: <b>${s.chips}</b></p>
          <p>laatste zet: <b>${s.laatste_actie}</b></p>
          ${s.gefold ? '<p class="gefold-label">GEFOLD</p>' : ''}
        </div>`;
    }

    // nieuwe hand: eerst schudden, dan kort daarna de kaarten uitdelen
    if (data.fase === "preflop" && vorige_fase !== "preflop" && data.community.length === 0) {
      speel("geluid_schudden");
      setTimeout(() => speel("geluid_kaart"), 1200);
    }

    // geluid per actie van een speler
    for (const pid of [1, 2]) {
      const speler = data.spelers[pid];
      const actie = speler.laatste_actie;
      if (actie !== vorige_acties[pid]) {
        if (actie === "check") {
          speel("geluid_klop");
        } else if (actie === "fold") {
          speel("geluid_kaart");
        } else if (actie === "call") {
          speel("geluid_chips");
        } else if (actie.startsWith("raise naar")) {
          if (speler.street_bet > speler.chips) {
            speel("geluid_allin");
          } else {
            speel("geluid_chips");
          }
        }
        vorige_acties[pid] = actie;
      }
    }
    vorige_fase = data.fase;

    if (data.fase === "showdown" || data.fase === "einde") {
      document.getElementById("wintekst").textContent = data.wintekst;
      document.getElementById("timer_zone").textContent = "";
    } else {
      document.getElementById("wintekst").textContent = "";
      const t = data.resterende_tijd;
      document.getElementById("timer_zone").textContent = `Speler ${data.beurt} heeft nog ${t} seconden`;
    }

  } catch (e) {
    console.error("Kon status niet ophalen:", e);
  }
}

setInterval(ververs, 1000);
ververs();
</script>
</body>
</html>
